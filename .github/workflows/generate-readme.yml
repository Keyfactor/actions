name: Generate README from templates and data files using doctool
on:
  workflow_call:
    inputs:
      doctool-ref:
        description: 'Git ref (tag/branch/commit) of keyfactor/doctooldotnet to run. Pinned to a known-good commit by default so doctool changes cannot silently alter generated docs; bump deliberately.'
        type: string
        required: false
        default: '031c69536c678c149ac70c4408caf13306852f22'
    secrets:
      token:
        description: 'Secret token from caller workflow to approve readme'
        required: true
permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    name: Use private doctool action in public repository
    steps:
      - name: Checkout integration repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.token }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Checkout doctool action
        uses: actions/checkout@v4
        with:
          repository: keyfactor/doctooldotnet
          ref: ${{ inputs.doctool-ref }}
          path: doctooldotnet
          token: ${{ secrets.token }}
          clean: false

      - name: Launch local doctool
        uses: ./doctooldotnet
        id: launch-doctool
        with:
          token: ${{ secrets.token }}