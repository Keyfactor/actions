name: Starter — .NET
# Entry point for .NET integration repositories. Self-contained: computes the
# version, runs compliance, builds + (full-release) signs + packages, and only
# then publishes the release. A release can never be created before the build
# and compliance jobs succeed.
on:
  workflow_call:
    # No PAT. NuGet restore, release publishing, and the post-release PR all run
    # on the implicit GITHUB_TOKEN. (Cross-repo/org-admin lifecycle jobs cannot
    # run on GITHUB_TOKEN — see notes in lifecycle.yml.)
    secrets:
      scan_token:
        description: 'Polaris (Black Duck) access token. If absent, the Polaris scan is skipped.'
        required: false
      signing_cert:
        description: 'Code-signing certificate (base64 PFX or Trusted Signing config). NOT YET WIRED.'
        required: false
      signing_pass:
        description: 'Password/secret for the signing certificate. NOT YET WIRED.'
        required: false

permissions:
  contents: read

jobs:
  version:
    uses: ./.github/workflows/version.yml

  compliance:
    uses: ./.github/workflows/compliance.yml
    secrets:
      scan_token: ${{ secrets.scan_token }}

  build:
    name: Build, sign & package
    needs: [version, compliance]
    runs-on: windows-latest
    permissions:
      contents: read
      packages: read # read the Keyfactor GitHub Packages NuGet feed with GITHUB_TOKEN
    env:
      REL_VER: ${{ needs.version.outputs.release_version || '1.0.0' }}
      IS_FULL_RELEASE: ${{ needs.version.outputs.IS_FULL_RELEASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup dotnet
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            3.1.x
            6.0.x
            8.0.x
            10.0.x

      - name: Setup build environment
        shell: pwsh
        env:
          ACTOR: ${{ github.actor }}
          # GITHUB_TOKEN (with packages: read) reads the Keyfactor feed without a PAT.
          # Requires each Keyfactor package to grant Actions access to the integration
          # repo (package settings → "Manage Actions access"). On fork PRs this token is
          # read-only and no secrets are exposed, so forks can still restore + build.
          NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repoName = "${{ github.repository }}".Split("/")
          echo "REPO_NAME=$($repoName[-1])" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          # Read the two manifest values the build needs (replaces assign-env-from-json).
          $manifest = Get-Content integration-manifest.json -Raw | ConvertFrom-Json
          echo "RELEASE_DIR=$($manifest.release_dir)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          echo "RELEASE_PROJECT=$($manifest.release_project)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          $slnPath = (Get-ChildItem -Include *.sln -File -Recurse).fullname
          echo "SOLUTION_PATH=${slnPath}" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          # Register the Keyfactor NuGet feed; update credentials if already present.
          $addOutput = dotnet nuget add source https://nuget.pkg.github.com/Keyfactor/index.json `
            -n keyfactor -u $env:ACTOR -p $env:NUGET_TOKEN --store-password-in-clear-text 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Source already registered; updating credentials..."
            $lines = dotnet nuget list source
            $sourceName = $null
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match 'nuget\.pkg\.github\.com/Keyfactor') {
                if ($lines[$i-1] -match '^\s+\d+\.\s+(\S+)') { $sourceName = $Matches[1] }
              }
            }
            if ($sourceName) {
              dotnet nuget update source $sourceName -u $env:ACTOR -p $env:NUGET_TOKEN --store-password-in-clear-text
            } else {
              Write-Error "Could not locate Keyfactor NuGet source to update credentials."
              exit 1
            }
          }
          dotnet restore $slnPath

      - name: Increment Assembly Version
        shell: pwsh
        run: |
          $VersionRegex = "\d+\.\d+\.\d+"
          $assemblyInfoFiles = (Get-ChildItem -Include AssemblyInfo.cs -File -Recurse).fullname
          if ($assemblyInfoFiles -ne $null) {
            $newVer = "$env:REL_VER".TrimStart('v').Split('-')[0]
            echo "Setting Assembly version to: ${newVer}"
            foreach ($assemblyInfoFile in $assemblyInfoFiles) {
              attrib $assemblyInfoFile -r
              (Get-Content $assemblyInfoFile) -replace $VersionRegex, $newVer | Out-File $assemblyInfoFile
            }
          }

      - name: Build
        shell: pwsh
        run: |
          $newVer = "$env:REL_VER".TrimStart('v').Split('-')[0]
          dotnet build $env:SOLUTION_PATH --no-restore -c Release -p:Version=$newVer

      # --- Signing hook -------------------------------------------------------
      # Full releases ONLY. RCs and validation builds are intentionally unsigned
      # for now. This is a documented placeholder: provision the signing tool and
      # the signing_cert/signing_pass secrets, then implement the signtool call.
      - name: Sign binaries
        if: env.IS_FULL_RELEASE == 'True'
        shell: pwsh
        env:
          SIGNING_CERT: ${{ secrets.signing_cert }}
          SIGNING_PASS: ${{ secrets.signing_pass }}
        run: |
          Write-Host "TODO(signing): no signing performed yet (full-release hook)."
          # Example, enable once secrets/tooling are provisioned:
          # & signtool sign /f $env:SIGNING_CERT /p $env:SIGNING_PASS `
          #   /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
          #   (Get-ChildItem -Recurse -Path "$env:RELEASE_DIR" -Include *.dll,*.exe).FullName

      - name: Read target frameworks
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_PROJECT) -or -not (Test-Path $env:RELEASE_PROJECT)) {
            Write-Host "No release_project specified; packaging release_dir as a single archive."
            echo "release_platforms=" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            [xml]$csproj = Get-Content $env:RELEASE_PROJECT
            $tfm = $csproj.Project.PropertyGroup.TargetFrameworks
            if ($null -eq $tfm) { $tfm = $csproj.Project.PropertyGroup.TargetFramework }
            echo "release_platforms=$tfm" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Package artifacts
        shell: pwsh
        run: |
          $outputDir = "${{ github.workspace }}\zip\Keyfactor"
          if (Test-Path $outputDir) { Remove-Item -Recurse -Force $outputDir }
          New-Item -ItemType Directory -Path $outputDir | Out-Null

          if ([string]::IsNullOrWhiteSpace($env:release_platforms)) {
            $sourcePath = "${{ github.workspace }}\$env:RELEASE_DIR\"
            $zipPath = "$outputDir\$($env:REPO_NAME)_$($env:REL_VER).zip"
            Compress-Archive -Path $sourcePath -DestinationPath $zipPath -Force
          } else {
            foreach ($platform in $env:release_platforms.Split(';')) {
              $platform = $platform.Trim()
              $sourcePath = "${{ github.workspace }}\$env:RELEASE_DIR\$platform\"
              $zipPath = "$outputDir\$($env:REPO_NAME)_$($env:REL_VER)_$platform.zip"
              Compress-Archive -Path $sourcePath -DestinationPath $zipPath -Force
            }
          }
          Get-ChildItem -File -Path $outputDir

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-zips
          path: zip/Keyfactor/*.zip
          if-no-files-found: warn

  publish:
    needs: [version, compliance, build]
    # Publish an RC on open PRs to release-*.*, and the full release on merge.
    # Gated behind build + compliance, so nothing publishes before checks pass.
    if: needs.version.outputs.IS_RELEASE_BRANCH == 'True' && (needs.version.outputs.IS_PRE_RELEASE == 'True' || needs.version.outputs.IS_FULL_RELEASE == 'True')
    uses: ./.github/workflows/publish-release.yml
    with:
      release_version: ${{ needs.version.outputs.release_version }}
      prerelease: ${{ needs.version.outputs.IS_PRE_RELEASE == 'True' }}
      artifact_name: release-zips

  lifecycle:
    needs: [version]
    uses: ./.github/workflows/lifecycle.yml
    with:
      is_full_release: ${{ needs.version.outputs.IS_FULL_RELEASE }}
      release_version: ${{ needs.version.outputs.release_version }}
      release_branch: ${{ github.event.pull_request.base.ref }}
