name: Compliance checks
# One-shot pre-release compliance gate: license headers, TODO report, and the
# Polaris (Black Duck) SCA/SAST scan. Replaces check-todos-license-headers.yml
# and kf-polaris-scan.yml. A failure here blocks the build and any publish.
on:
  workflow_call:
    secrets:
      scan_token:
        description: 'Polaris (Black Duck) access token. If absent, the Polaris scan is skipped.'
        required: false

permissions:
  contents: read

jobs:
  headers:
    name: License headers & TODOs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Report TODOs (non-blocking)
        run: |
          echo "### TODO statements" >> "$GITHUB_STEP_SUMMARY"
          grep -rIl --include='*.cs' --include='*.go' -i 'todo' . \
            | tee -a "$GITHUB_STEP_SUMMARY" || echo "_None found_" >> "$GITHUB_STEP_SUMMARY"

      - name: Require Apache license headers
        run: |
          missing=$(find . -path ./.git -prune -o \
            \( -name 'README.md' -o -name 'AssemblyInfo.cs' \) -prune -o \
            -type f \( -iname '*.cs' -o -iname '*.go' \) -exec grep -L 'Apache License' {} + || true)
          if [ -n "$missing" ]; then
            echo "::error::The following files are missing the Apache License header:"
            echo "$missing"
            exit 1
          fi
          echo "All source files carry the Apache License header."

  polaris:
    name: Polaris SCA/SAST
    # Fork PRs receive a read-only GITHUB_TOKEN, so PR comments / SARIF upload
    # would fail. Restrict the scan to same-repo PRs to avoid noisy failures.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    env:
      POLARIS_TOKEN: ${{ secrets.scan_token }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Polaris scan
        if: env.POLARIS_TOKEN != ''
        uses: blackduck-inc/black-duck-security-scan@3fe94e4b3c3947bd21ba46b7da255d6d3638b325 # v2
        with:
          polaris_server_url: 'https://polaris.blackduck.com'
          polaris_access_token: ${{ secrets.scan_token }}
          polaris_assessment_types: 'SCA,SAST'
          polaris_application_name: 'Integrations'
          polaris_project_name: ${{ github.event.repository.name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          polaris_prComment_enabled: true
          polaris_reports_sarif_create: true
