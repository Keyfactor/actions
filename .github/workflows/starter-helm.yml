name: Starter — Helm / Container
# Entry point for container + Helm chart integration repositories. Builds
# multi-arch images and the Helm chart; images are pushed and the chart is
# released only on the publish path (RC on open PR, final on merge) and only
# after compliance passes. platform_matrix is read from integration-manifest.json.
on:
  workflow_call:
    # No PAT. Image push uses the registry creds below; chart-releaser and the
    # post-release PR use the implicit GITHUB_TOKEN. (Cross-repo/org-admin
    # lifecycle jobs cannot run on GITHUB_TOKEN — see lifecycle.yml.)
    secrets:
      docker_user:
        description: 'Container registry username.'
        required: false
      docker_token:
        description: 'Container registry token/password.'
        required: false
      scan_token:
        description: 'Polaris (Black Duck) access token. If absent, the Polaris scan is skipped.'
        required: false

permissions:
  contents: read

env:
  REGISTRY: keyfactor

jobs:
  version:
    uses: ./.github/workflows/version.yml

  compliance:
    uses: ./.github/workflows/compliance.yml
    secrets:
      scan_token: ${{ secrets.scan_token }}

  setup:
    name: Read platform matrix
    runs-on: ubuntu-latest
    outputs:
      platform_matrix: ${{ steps.vars.outputs.platform_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Read platform_matrix from manifest
        id: vars
        run: echo "platform_matrix=$(jq -c '.platform_matrix' integration-manifest.json)" | tee -a "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"

  get-release-values:
    name: Determine publish values
    needs: [version]
    runs-on: ubuntu-latest
    outputs:
      PUSH_IMAGE: ${{ steps.set-vars.outputs.PUSH_IMAGE }}
      VERSION: ${{ steps.set-vars.outputs.VERSION }}
    env:
      IS_RELEASE_BRANCH: ${{ needs.version.outputs.IS_RELEASE_BRANCH }}
      IS_PRE_RELEASE: ${{ needs.version.outputs.IS_PRE_RELEASE }}
      IS_FULL_RELEASE: ${{ needs.version.outputs.IS_FULL_RELEASE }}
      REL_VER: ${{ needs.version.outputs.release_version }}
    steps:
      - name: Set PUSH_IMAGE / VERSION
        id: set-vars
        run: |
          if [[ "$IS_RELEASE_BRANCH" == "True" && ( "$IS_PRE_RELEASE" == "True" || "$IS_FULL_RELEASE" == "True" ) ]]; then
            echo "PUSH_IMAGE=true" | tee -a "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "VERSION=${REL_VER}" | tee -a "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "PUSH_IMAGE=false" | tee -a "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "VERSION=0.0.0" | tee -a "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  run-container-build:
    name: Build containers
    runs-on: ubuntu-latest
    needs: [setup, get-release-values, compliance]
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.setup.outputs.platform_matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set IMAGE_NAME
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{raw}},value=${{ needs.get-release-values.outputs.VERSION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.docker_user }}
          password: ${{ secrets.docker_token }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ needs.get-release-values.outputs.PUSH_IMAGE == 'true' }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge image manifests
    runs-on: ubuntu-latest
    needs: [get-release-values, run-container-build]
    if: needs.get-release-values.outputs.PUSH_IMAGE == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set IMAGE_NAME
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: digests
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{raw}},value=${{ needs.get-release-values.outputs.VERSION }}

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.docker_user }}
          password: ${{ secrets.docker_token }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # Word splitting on the command substitutions is intentional here: each
          # tag and digest must become a separate argument to imagetools create.
          # shellcheck disable=SC2046
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)

      - name: Inspect image
        env:
          META_VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${META_VERSION}"

  helm:
    name: Release Helm chart
    runs-on: ubuntu-latest
    needs: [version, get-release-values, compliance]
    if: needs.get-release-values.outputs.PUSH_IMAGE == 'true'
    permissions:
      contents: write
    env:
      REL_VER: ${{ needs.version.outputs.release_version }}
    steps:
      - name: Set IMAGE_NAME
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Update Helm chart version
        run: |
          sed -i "s/^version: .*/version: ${REL_VER}/g" "deploy/charts/${IMAGE_NAME}/Chart.yaml"
          sed -i "s/^appVersion: .*/appVersion: \"v${REL_VER}\"/g" "deploy/charts/${IMAGE_NAME}/Chart.yaml"

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          charts_dir: deploy/charts

  lifecycle:
    needs: [version]
    uses: ./.github/workflows/lifecycle.yml
    with:
      is_full_release: ${{ needs.version.outputs.IS_FULL_RELEASE }}
      release_version: ${{ needs.version.outputs.release_version }}
      release_branch: ${{ github.event.pull_request.base.ref }}
